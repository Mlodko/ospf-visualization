!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
ip route 0.0.0.0/0 192.168.20.5
!
interface Loopback0
ip address 6.6.6.6 255.255.255.255
!
interface Loopback1
ip address 172.16.10.6 255.255.255.0
!
interface Loopback2
ip address 172.16.11.6 255.255.255.0
!
interface Loopback3
ip address 172.16.12.6 255.255.255.0
!
interface eth0
ip address 192.168.20.6 255.255.255.0
!
! Enable SNMP AgentX
agentx
!
end