!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
interface Loopback0
ip address 10.10.10.10 255.255.255.255
!
interface eth0
ip address 192.168.3.10 255.255.255.0
!
router ospf
router-id 10.10.10.10
network 10.10.10.10/32 area 3
network 192.168.3.0/24 area 3
!
! Enable SNMP AgentX
agentx
!
end