!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
ip route 6.6.6.6 255.255.255.255 192.168.20.6
ip route 172.16.10.0 255.255.255.0 192.168.20.6
ip route 172.16.11.0 255.255.255.0 192.168.20.6
ip route 172.16.12.0 255.255.255.0 192.168.20.6
!
interface Loopback0
ip address 5.5.5.5 255.255.255.255
!
interface Loopback10
no ip address
!
interface eth0
ip address 192.168.2.5 255.255.255.0
!
interface eth1
ip address 192.168.1.5 255.255.255.0
!
interface eth2
ip address 192.168.20.5 255.255.255.0
!
router ospf
router-id 5.5.5.5
network 5.5.5.5/32 area 51
network 192.168.1.0/24 area 51
network 192.168.2.0/24 area 51
redistribute static
redistribute connected
!
! Enable SNMP AgentX
agentx
!
end