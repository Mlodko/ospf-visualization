!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
interface Loopback0
ip address 4.4.4.4 255.255.255.255
!
interface Loopback10
no ip address
!
interface eth0
ip address 20.20.20.4 255.255.255.0
!
interface eth1
ip address 192.168.1.4 255.255.255.0
!
router ospf
router-id 4.4.4.4
network 20.20.20.0/24 area 0
network 4.4.4.4/32 area 0
network 192.168.1.0/24 area 51
!
!
! Enable SNMP AgentX
agentx
!
end