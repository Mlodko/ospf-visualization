!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
interface Loopback0
ip address 3.3.3.3 255.255.255.255
!
interface Loopback10
no ip address
!
interface eth0
ip address 20.20.20.3 255.255.255.0
!
interface eth1
ip address 192.168.6.3 255.255.255.0
!
interface eth2
ip address 192.168.3.3 255.255.255.0
!
router ospf
router-id 3.3.3.3
network 20.20.20.0/24 area 0
network 3.3.3.3/32 area 0
network 192.168.6.0/24 area 2
network 192.168.3.0/24 area 3
area 2 virtual-link 7.7.7.7
!
! Enable SNMP AgentX
agentx
!
end