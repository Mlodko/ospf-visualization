!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
ip route 0.0.0.0/0 203.0.113.2
!
interface Loopback0
ip address 1.1.1.1 255.255.255.255
!
interface Loopback10
no ip address
!
interface eth0
ip address 203.0.113.2 255.255.255.252
!
interface eth1
ip address 20.20.20.11 255.255.255.0
!
router ospf
router-id 1.1.1.1
network 20.20.20.0/24 area 0
network 1.1.1.1/32 area 0
default-information originate always
!
! Enable SNMP AgentX
agentx
!
end