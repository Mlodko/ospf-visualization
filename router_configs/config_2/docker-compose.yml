services:
  r1:
    build: .
    container_name: c2_r1
    privileged: true
    hostname: r1
    volumes:
      - ./r1/frr.conf:/etc/frr/frr.conf
      - ./snmpd.conf:/etc/snmp/snmpd.conf
      - ./ospfd.conf:/etc/frr/ospfd.conf
      - ./isisd.conf:/etc/frr/isisd.conf
    networks:
      net_ext:
        ipv4_address: 203.0.113.2
      net_1234:
        ipv4_address: 20.20.20.11
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    ports:
