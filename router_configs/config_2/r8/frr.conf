!
! FRR Configuration with full northbound API support
!
frr version 8.4
frr defaults datacenter
hostname frr-router
service integrated-vtysh-config
log file /var/log/frr/ospfd.log debugging
!
interface Loopback0
ip address 8.8.8.8 255.255.255.255
!
interface eth0
ip address 20.20.30.8 255.255.255.0
!
router ospf
router-id 8.8.8.8
network 8.8.8.8/32 area 0
network 20.20.30.0/24 area 0
! Enable SNMP AgentX
agentx
!
end